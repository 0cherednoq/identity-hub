name: Admin CI

on:
  push:
    paths:
      - "admin/**"
      - "src/identity_hub/**"
      - "docs/admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    paths:
      - "admin/**"
      - "src/identity_hub/**"
      - "docs/admin/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

env:
  IH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/identity_hub_test

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_hub_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: admin/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --project admin --locked --all-groups
      - run: uv run --project admin poe -C admin check-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json
      - run: npm ci --prefix admin/frontend
      - run: npm run api:check --prefix admin/frontend
      - run: npm run check --prefix admin/frontend
      # только то, что попадает в сборку: у dev-инструмента линтинга (@boundaries/eslint-plugin)
      # транзитивные handlebars и braces без исправленной версии
      - run: npm audit --omit=dev --prefix admin/frontend

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: admin/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: uv sync --project admin --locked --all-groups
      - run: uv run --project admin poe -C admin test-contract
      - run: uv run python docs/admin/progress_tool.py validate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: admin/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/frontend/package-lock.json
      - run: uv sync --project admin --locked --all-groups
      - run: npm ci --prefix admin/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: admin/frontend
      - run: npm run test:e2e --prefix admin/frontend
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: admin/test-results
          if-no-files-found: warn
