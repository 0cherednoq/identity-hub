name: Extended tests

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

concurrency:
  group: extended-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  IH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/identity_hub_test

jobs:
  load:
    name: Load tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: identity_hub_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run pytest -m load -q -rfE

  pgbouncer:
    name: PgBouncer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: identity_hub_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: identity_hub_test
          POOL_MODE: transaction
          AUTH_TYPE: scram-sha-256
          MAX_CLIENT_CONN: "500"
          DEFAULT_POOL_SIZE: "20"
          MAX_PREPARED_STATEMENTS: "0"
        ports:
          - 6432:5432
    env:
      IH_TEST_PGBOUNCER: "1"
      IH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:6432/identity_hub_test
      IH_TEST_MIGRATE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/identity_hub_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: >-
          uv run pytest -m pg -q -rfE
          tests/pg/test_pgbouncer.py tests/pg/test_acquire.py tests/pg/test_lease_lifecycle.py
          tests/pg/test_outbox.py tests/pg/test_register.py tests/pg/test_dispatcher.py
