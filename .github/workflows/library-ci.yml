name: Library CI

on:
  push:
    paths:
      - "src/identity_hub/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/library-ci.yml"
  pull_request:
    paths:
      - "src/identity_hub/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/library-ci.yml"

permissions:
  contents: read

env:
  IH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/identity_hub_test

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_hub_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d identity_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: bash scripts/check.sh
      # check.sh начинает с автоисправления: непустой diff означает неотформатированный код.
      - run: git diff --exit-code

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv build --out-dir dist
      - run: bash scripts/check_package.sh dist
