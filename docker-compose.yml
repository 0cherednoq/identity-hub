# Локальная БД для разработки: IH_TEST_DATABASE_URL=postgresql+asyncpg://ih:ih@localhost:55432/ih
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ih
      POSTGRES_PASSWORD: ih
      POSTGRES_DB: ih
    ports:
      - "55432:5432"
    command: ["postgres", "-c", "max_connections=300"]
