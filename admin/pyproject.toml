[project]
name = "identity-hub-admin"
version = "0.1.0.dev0"
description = "Web administration application for Identity Hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23,<26",
    "identity-hub[alembic,postgres]",
    "litestar[standard]>=2.17,<3",
    "packaging>=24,<27",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
identity-hub-admin = "identity_hub_admin.cli:main"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "mypy>=1.18,<3",
    "poethepoet>=0.37,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
    "testcontainers[postgres]>=4.13,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_hub_admin"]
artifacts = ["src/identity_hub_admin/static/**"]

[tool.uv.sources]
identity-hub = { path = "..", editable = true }

[tool.poe.tasks]
dev = "python scripts/dev.py"
dev-backend = "litestar --app identity_hub_admin.dev:app run --reload --host 127.0.0.1 --port 8765"
dev-frontend = { shell = "npm run dev", cwd = "frontend" }
lint-backend = "ruff check src tests scripts"
format-backend = "ruff format --check src tests scripts"
typecheck-backend = "mypy src tests scripts"
test-backend = "pytest"
test-contract = "pytest -m contract"
export-openapi = "python scripts/export_openapi.py"
check-openapi = "python scripts/export_openapi.py --check"
check-backend = { sequence = ["lint-backend", "format-backend", "typecheck-backend", "test-backend"] }
check-frontend = { shell = "npm run check", cwd = "frontend" }
generate-client = { sequence = ["export-openapi", "generate-client-frontend"] }
generate-client-frontend = { shell = "npm run api:generate", cwd = "frontend" }
check-client = { sequence = ["check-openapi", "check-client-frontend"] }
check-client-frontend = { shell = "npm run api:check", cwd = "frontend" }
test-e2e = { shell = "npm run test:e2e", cwd = "frontend" }
test-visual = { shell = "npm run test:visual", cwd = "frontend" }
build-frontend = { shell = "npm run build", cwd = "frontend" }
build-wheel = "uv build --wheel"
build = { sequence = ["build-frontend", "build-wheel"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "contract: HTTP/OpenAPI contract tests",
    "integration: tests that require PostgreSQL",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["identity_hub.*"]
ignore_missing_imports = true
