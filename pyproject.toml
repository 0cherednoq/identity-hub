[project]
name = "identity-hub"
version = "1.0.0a1"
description = "Управление парком аккаунтов: жизненный цикл, аренда, лимиты, прокси, секреты, события."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Identity Hub contributors" }]
keywords = ["accounts", "identity", "lease", "proxy", "secrets", "postgresql", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "cryptography>=42",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uuid-utils>=1.0; python_version < '3.14'",  # проверенная версия; монотонность даёт new_id()
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
alembic = ["alembic>=1.13"]
telegram = ["httpx>=0.27"]
structlog = ["structlog>=24.1"]
webhooks = ["httpx>=0.27"]
testing = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[project.scripts]
identity-hub = "identity_hub.cli:main"

[project.entry-points.pytest11]
identity-hub = "identity_hub.testing.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.7",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-timeout>=2.4.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_hub"]

# The source distribution contains only files required to build and describe the library.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/identity_hub",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md", "docs/review/repro"]  # repro — разовые скрипты ревью

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.ruff.lint.per-file-ignores]
"src/identity_hub/postgres/models.py" = ["E501"]  # выровненные комментарии к колонкам

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asyncpg.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# I8.8b: вызов устаревшего API библиотеки — ошибка; тесты алиасов ловят его через pytest.warns
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: без БД",
    "pg: требует PostgreSQL",
    "conformance: общий набор для всех Store",
    "load: нагрузочные, запускаются явно",
]
addopts = "-ra --strict-markers"
timeout = 120  # зависший тест не блокирует автономный цикл

[tool.importlinter]
root_package = "identity_hub"
include_external_packages = true
# только рантайм-импорты: аннотации под TYPE_CHECKING слоя не нарушают
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Доменный слой без инфраструктуры (IMP-19)"
type = "forbidden"
# прямые импорты: hub — корень композиции и транзитивно видит всё
allow_indirect_imports = true
source_modules = ["identity_hub.domain"]
forbidden_modules = [
    "sqlalchemy",
    "alembic",
    "httpx",
    "aiogram",
    "identity_hub.postgres",
    "identity_hub.dispatch",
    "identity_hub.hub",
]

[[tool.importlinter.contracts]]
name = "Неймспейсы, read-модели, интеграции и контракт Store не знают PostgreSQL (IMP-19)"
type = "forbidden"
# прямые импорты: hub — корень композиции и транзитивно видит всё
allow_indirect_imports = true
source_modules = [
    "identity_hub.api",
    "identity_hub.read",
    "identity_hub.dispatch",
    "identity_hub.telegram_notify",
    "identity_hub.store",
    "identity_hub.testing",
]
forbidden_modules = ["identity_hub.postgres"]

[[tool.importlinter.contracts]]
name = "Неймспейсы API и read-модели не ходят в SQL напрямую (IMP-19)"
type = "forbidden"
# прямые импорты: hub — корень композиции и транзитивно видит всё
allow_indirect_imports = true
source_modules = ["identity_hub.api", "identity_hub.read", "identity_hub.domain"]
forbidden_modules = ["sqlalchemy", "alembic"]
